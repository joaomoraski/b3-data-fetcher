[project]
name = "b3-data-fetcher"
version = "0.1.0"
description = ""
authors = [
    { name = "joaomoraski", email = "joaomoraskilunkes@gmail.com" }
]
readme = "README.md"
package-mode = false
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = { extras = ["standard"], version = "^0.120.0" }
dotenv = "^0.9.9"
requests = "^2.32.5"
yfinance = "^0.2.66"
pandas = "^2.3.3"
pydantic-settings = "^2.11.0"
uvicorn = "^0.38.0"
sqlmodel = "^0.0.27"
psycopg2-binary = "^2.9.11"
alembic = "^1.17.0"
tqdm = "^4.67.1"
asyncpg = "^0.30.0"
asyncio = "^4.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
ipython = [
    "ipython (>=9.6.0,<10.0.0)"
]
dev = [
    "pre-commit (>=4.3.0,<5.0.0)",
    "ruff (>=0.14.2,<0.15.0)"
]
